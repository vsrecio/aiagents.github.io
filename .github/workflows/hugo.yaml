# Workflow for syncing approved speakers & talks from Sessionize, committing them to git, and deploying Hugo to GitHub Pages
name: Deploy Hugo site to Pages

on:
    # Runs on pushes to main
    push:
        branches:
            - main

    # Polls Sessionize every 15 minutes for newly approved speakers & talks
    schedule:
        - cron: '*/15 * * * *'

    # Allows running this workflow manually from the Actions tab
    workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow committing Sessionize updates and deploying to GitHub Pages
permissions:
    contents: write
    pages: write
    id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
    group: 'pages'
    cancel-in-progress: false

# Default to bash
defaults:
    run:
        shell: bash

jobs:
    # Sync Sessionize & Build job
    build:
        runs-on: ubuntu-latest
        outputs:
            should_deploy: ${{ steps.decide.outputs.should_deploy }}
        env:
            HUGO_VERSION: 0.156.0
            SESSIONIZE_ID: zoi3u8ka
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  ref: main
                  submodules: recursive
                  fetch-depth: 0

            - name: Sync approved speakers and talks from Sessionize
              id: sync
              env:
                  COMMIT_CHANGES: 'true'
                  PUSH_CHANGES: 'true'
              run: bash .github/scripts/sync-sessionize.sh

            - name: Decide whether to build and deploy
              id: decide
              run: |
                  if [[ "${{ github.event_name }}" == "schedule" && "${{ steps.sync.outputs.changed }}" != "true" ]]; then
                    echo "No hubo cambios en Sessionize durante la ejecución programada; se omite el build."
                    echo "should_deploy=false" >> "$GITHUB_OUTPUT"
                  else
                    echo "should_deploy=true" >> "$GITHUB_OUTPUT"
                  fi

            - name: Install Hugo CLI
              if: steps.decide.outputs.should_deploy == 'true'
              run: |
                  wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
                  && sudo dpkg -i ${{ runner.temp }}/hugo.deb

            - name: Setup Pages
              id: pages
              if: steps.decide.outputs.should_deploy == 'true'
              uses: actions/configure-pages@v5

            - name: Build with Hugo
              if: steps.decide.outputs.should_deploy == 'true'
              env:
                  HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
                  HUGO_ENVIRONMENT: production
                  TZ: America/Santo_Domingo
              run: |
                  hugo \
                    --gc \
                    --minify \
                    --baseURL "${{ steps.pages.outputs.base_url }}/"

            - name: Upload artifact
              if: steps.decide.outputs.should_deploy == 'true'
              uses: actions/upload-pages-artifact@v3
              with:
                  path: ./public

    # Deployment job
    deploy:
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        runs-on: ubuntu-latest
        needs: build
        if: github.ref == 'refs/heads/main' && needs.build.outputs.should_deploy == 'true'
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4

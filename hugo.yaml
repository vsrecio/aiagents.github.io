baseURL: https://aiagents.day/
title: AI Agents Day
theme: event

defaultContentLanguage: es
defaultContentLanguageInSubdir: false

# Landing-only mode: only the home page is generated.
# No taxonomies, RSS or sitemap.
disableKinds:
    - taxonomy
    - term
    - RSS
    - sitemap

# Landing-only mode: every regular page (about, sponsors, location, code of
# conduct, privacy policy, and Sessionize sessions/speakers) is kept in the
# source but neither rendered nor listed. Remove this block to re-enable them.
cascade:
    - build:
          render: never
          list: never
      target:
          kind: '{page,section}'

languages:
    _merge: deep
    es:
        languageName: Español
        weight: 1
        disabled: false
        params:
            # Open Graph / X (Twitter) Cards
            description: |
                AI Agents Day — Ideas que construyen el futuro de los agentes de IA. Sábado 12 de diciembre de 2026 · Evento 100% Online y 100% GRATIS para las comunidades tecnológicas de LATAM.
            themes:
                event:
                    eyebrow: PEOPLE — IDEAS — AGENTS — REAL IMPACT
                    slogan: Ideas que construyen el futuro de los agentes de IA. Un evento 100% gratis para las comunidades tecnológicas de LATAM.
                    dateLabel: Sábado 12 de Diciembre de 2026
                    statusBadge: Call for Speakers abierto · Acceso 100% gratuito
                    location: '100% Online'
                    freeLabel: '100% Gratis · Comunidades Tech LATAM'
                    description: |
                        **AI Agents Day** es un encuentro técnico **100% online y 100% GRATIS para las comunidades tecnológicas de LATAM**,
                        dedicado a la ingeniería de agentes de inteligencia artificial: estándares abiertos, conectividad segura,
                        aislamiento en runtime, arquitecturas multi-agente y gobernanza para la autonomía en producción. Te esperamos el **sábado 12 de diciembre de 2026**
                        para explorar **Model Context Protocol (MCP)**, **AGENTS.md**, **Agent2Agent (A2A)**,
                        **agentgateway**, **Agent Router**, **Docker Sandboxes (MicroVMs)**, **ADK Agents**, **Arquitecturas de Agentes** y **AI Governance**.
                    stats:
                        - number: 'MCP · A2A'
                          unit: Protocolos & AGENTS.md
                        - number: 'GATEWAY'
                          unit: agentgateway & Agent Router
                        - number: 'MICROVM'
                          unit: Docker Sandboxes Runtime
                        - number: '100% GRATIS'
                          unit: Comunidades Tech de LATAM
                    aboutUs: |
                        Más información sobre el evento estará disponible pronto.
                    callToActionSecondary:
                        label: Enviar charla en Sessionize
                        url: https://sessionize.com/ai-agents-day/

    # English version (/en/)
    en:
        languageName: English
        weight: 2
        disabled: false
        params:
            description: |
                AI Agents Day — Ideas building the future of AI agents. Saturday, December 12, 2026 · 100% Online & 100% Free for LATAM tech communities.
            themes:
                event:
                    eyebrow: PEOPLE — IDEAS — AGENTS — REAL IMPACT
                    slogan: Ideas building the future of AI agents. A 100% free event for LATAM tech communities.
                    dateLabel: Saturday, December 12, 2026
                    statusBadge: Call for Speakers Open · 100% Free Access
                    location: '100% Online'
                    freeLabel: '100% Free · LATAM Tech Communities'
                    description: |
                        **AI Agents Day** is a **100% online and 100% FREE technical conference for LATAM tech communities**,
                        dedicated to AI agent engineering: open standards, secure connectivity,
                        runtime isolation, multi-agent architectures, and governance for production autonomy. Join us on **Saturday, December 12, 2026**
                        to explore **Model Context Protocol (MCP)**, **AGENTS.md**, **Agent2Agent (A2A)**,
                        **agentgateway**, **Agent Router**, **Docker Sandboxes (MicroVMs)**, **ADK Agents**, **Agentic Architectures**, and **AI Governance**.
                    stats:
                        - number: 'MCP · A2A'
                          unit: Protocols & AGENTS.md
                        - number: 'GATEWAY'
                          unit: agentgateway & Agent Router
                        - number: 'MICROVM'
                          unit: Docker Sandboxes Runtime
                        - number: '100% FREE'
                          unit: LATAM Tech Communities
                    aboutUs: |
                        More information about the event will be added soon.
                    callToActionSecondary:
                        label: Submit a talk on Sessionize
                        url: https://sessionize.com/ai-agents-day/

    # The theme ships German defaults; keep it disabled.
    de:
        disabled: true

params:
    # Open Graph / X (Twitter) Cards
    images:
        - logos/aiagents-day.svg
    themes:
        event:
            # 👇 Sessionize API ID (https://sessionize.com/app/organizer/schedule/api/0)
            sessionizeId: zoi3u8ka
            title: AI Agents Day
            shortTitle: AI Agents Day
            startDate: 2026-12-12
            endDate: 2026-12-12
            # Virtual event: no physical address / map.
            address: []
            map:
                embeddableMapUrl:
                viewLargerMapUrl:
            # Landing-only mode: no CTA links (registration / call for speakers).
            callToAction:
                eventbrite:
                    eventId:
                other:
                    url:
                enableBanner: false
            callToActionSecondary:
                url: https://sessionize.com/ai-agents-day/
            socialLinks:
                xUrl:
                facebookUrl:
                linkedinUrl:
            favicon: favicon.svg
            images:
                logo: logos/aiagents-day.svg
                titleBackground: images/pexels-scottwebb-1048039.webp
                location:
            sponsors:
                - logo: logos/docker.webp
                  url: https://www.docker.com/
                  name: Docker
                  description: Plataforma líder en contenedores, entornos developer-first y Docker Sandboxes con aislamiento MicroVM para agentes de IA.
                  tier: platinum
            partners: []
            organizers: []
            featuredSessions: []
            colors:
                primaryLighter: '#D9D3C6'
                primary: '#E94B20'
                primaryDarker: '#285F87'
                primaryDarkest: '#141615'
                secondary: '#EEECE2'
                secondaryDarker: '#363937'
                track: '#285F87'
                shadow: '#14161526'
            redirectBasedOnBrowserLang: false
            disableGenerator: false
